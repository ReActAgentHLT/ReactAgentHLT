[project]
name = "reactagenthlt"
version = "0.0.1"
description = "Comparison on 3 types of different agents on QA and math problems"
readme = "README.md"
authors = [
    { name = "Federico Bustaffa" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "colorama>=0.4.6",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=10.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reactagenthlt", "reactagenthlt.*"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "notebook>=7.6.5",
    "pyqt6>=6.12.1",
]
